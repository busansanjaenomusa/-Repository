<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주사위 굴리기</title>
<style>
  :root {
    --bg-1: #eef2f7;
    --bg-2: #d9e1ec;
    --text: #1f2937;
    --muted: #6b7280;
    --die-face: #ffffff;
    --die-edge: #d6dbe3;
    --pip: #1f2937;
    --pip-one: #dc2626;
    --btn: #2563eb;
    --btn-hover: #1d4ed8;
    --btn-text: #ffffff;
    --shadow: rgba(15, 23, 42, 0.25);
    --bubble-bg: #ffffff;
    --bubble-text: #1f2937;
    --die-size: min(31vw, 170px);
    --person-w: min(25vw, 135px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-1: #111827;
      --bg-2: #0b1220;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --die-face: #f8fafc;
      --die-edge: #cbd5e1;
      --shadow: rgba(0, 0, 0, 0.6);
      --bubble-bg: #1f2937;
      --bubble-text: #f3f4f6;
    }
  }

  * { box-sizing: border-box; }

  html {
    background: var(--bg-2);
  }

  html, body {
    margin: 0;
    min-height: 100%;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 40px;
    padding: 16px;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    color: var(--text);
    background: radial-gradient(circle at 50% 35%, var(--bg-1), var(--bg-2));
    overflow-x: hidden;
  }

  h1 {
    margin: 0;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  /* 무대: 남자 - 주사위 - 여자 */
  .stage {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 3vw;
    padding-top: 64px;
    width: 100%;
    max-width: 560px;
  }

  /* 3D 장면 */
  .scene {
    flex: none;
    width: var(--die-size);
    height: var(--die-size);
    margin-bottom: calc(var(--die-size) * 0.18);
    perspective: 900px;
    position: relative;
  }

  .scene::after {
    /* 바닥 그림자 */
    content: "";
    position: absolute;
    left: 10%;
    right: 10%;
    bottom: calc(var(--die-size) * -0.32);
    height: calc(var(--die-size) * 0.14);
    background: radial-gradient(ellipse at center, var(--shadow), transparent 70%);
    filter: blur(4px);
    transition: transform 0.6s ease;
  }
  .scene.rolling::after {
    transform: scale(0.7);
  }

  .tilt {
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transform: rotateX(-22deg) rotateY(28deg);
  }

  .die {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 1.4s cubic-bezier(0.18, 0.9, 0.25, 1.05);
  }

  .face {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    padding: 14%;
    background: var(--die-face);
    border-radius: 18%;
    box-shadow:
      inset 0 0 0 2px var(--die-edge),
      inset 0 0 calc(var(--die-size) * 0.12) rgba(0, 0, 0, 0.12);
    backface-visibility: hidden;
  }

  .pip {
    width: 72%;
    height: 72%;
    margin: auto;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #4b5563, var(--pip) 65%);
    box-shadow: inset 0 2px 3px rgba(0, 0, 0, 0.5);
  }
  .face-1 .pip {
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 35% 35%, #f87171, var(--pip-one) 65%);
  }

  /* 눈 위치 (3x3 격자) */
  .tl { grid-area: 1 / 1; }
  .tr { grid-area: 1 / 3; }
  .ml { grid-area: 2 / 1; }
  .c  { grid-area: 2 / 2; }
  .mr { grid-area: 2 / 3; }
  .bl { grid-area: 3 / 1; }
  .br { grid-area: 3 / 3; }

  /* 면 배치: 마주보는 면의 합이 7 */
  .face-1 { transform: rotateY(0deg)   translateZ(calc(var(--die-size) / 2)); }
  .face-6 { transform: rotateY(180deg) translateZ(calc(var(--die-size) / 2)); }
  .face-3 { transform: rotateY(90deg)  translateZ(calc(var(--die-size) / 2)); }
  .face-4 { transform: rotateY(-90deg) translateZ(calc(var(--die-size) / 2)); }
  .face-2 { transform: rotateX(90deg)  translateZ(calc(var(--die-size) / 2)); }
  .face-5 { transform: rotateX(-90deg) translateZ(calc(var(--die-size) / 2)); }

  /* ===== 구경꾼 ===== */
  .person {
    flex: none;
    position: relative;
    width: var(--person-w);
  }
  .person svg {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
  }

  .skin  { fill: #f6c9a4; }
  .ear   { fill: #eab68f; }
  .line  { fill: none; stroke: #3b2a20; stroke-width: 3; stroke-linecap: round; }
  .dark  { fill: #3b2a20; }
  .white { fill: #ffffff; stroke: #3b2a20; stroke-width: 2; }
  .cheek { fill: #f28b8b; opacity: 0; transition: opacity 0.3s; }
  .tear  { fill: #7cc4ff; opacity: 0; }
  .mouth-in { fill: #9b2c2c; }

  .man .shirt  { fill: #3b82f6; }
  .man .sleeve { stroke: #3b82f6; }
  .man .hair   { fill: #2b2118; }
  .woman .shirt  { fill: #ec4899; }
  .woman .sleeve { stroke: #ec4899; }
  .woman .hair   { fill: #7a4a2a; }
  .woman .pin    { fill: #facc15; }

  .sleeve { fill: none; stroke-width: 14; stroke-linecap: round; }

  .body-g {
    transform-origin: 60px 200px;
    transition: transform 0.4s ease;
  }
  .arm {
    transition: transform 0.35s cubic-bezier(0.3, 1.4, 0.5, 1);
  }
  .arm-l { transform-origin: 30px 128px; }
  .arm-r { transform-origin: 90px 128px; }
  .head-g {
    transform-origin: 60px 100px;
  }
  .pupils {
    transition: transform 0.25s ease;
  }
  /* 주사위 쪽을 바라보기 */
  .man .pupils   { transform: translateX(2.5px); }
  .woman .pupils { transform: translateX(-2.5px); }

  /* 표정 파츠: 기본은 숨김, 상태에 따라 표시 */
  .e, .m, .brows { display: none; }
  .s-idle  .e-normal, .s-watch .e-normal, .s-ok .e-normal { display: inline; }
  .s-happy .e-happy, .s-joy .e-wow { display: inline; }
  .s-sad .e-sad, .s-bad .e-closed { display: inline; }
  .s-sad .brows, .s-bad .brows { display: inline; }

  .s-idle .m-smile, .s-ok .m-smile { display: inline; }
  .s-watch .m-o { display: inline; }
  .s-happy .m-open, .s-joy .m-open { display: inline; }
  .s-sad .m-sad, .s-bad .m-wail { display: inline; }

  .s-happy .cheek, .s-joy .cheek { opacity: 0.6; }
  .s-bad .tear { opacity: 1; animation: drip 1s ease-in infinite; }

  /* 지켜보는 중: 주사위 쪽으로 몸을 기울이고 들썩들썩 */
  .man.s-watch .body-g   { transform: rotate(5deg); }
  .woman.s-watch .body-g { transform: rotate(-5deg); }
  .s-watch .head-g { animation: nervous 0.35s ease-in-out infinite alternate; }
  .s-watch .arm-l { transform: rotate(25deg); }
  .s-watch .arm-r { transform: rotate(-25deg); }

  /* 6: 만세 + 점프 */
  .s-joy .body-g { animation: jump 0.45s ease-in-out 4; }
  .s-joy .arm-l { transform: rotate(135deg); }
  .s-joy .arm-r { transform: rotate(-135deg); }

  /* 5, 4: 한 팔 들어 올리기 */
  .man.s-happy .arm-l   { transform: rotate(140deg); }
  .woman.s-happy .arm-r { transform: rotate(-140deg); }
  .s-happy .body-g { animation: bounce 0.5s ease-in-out 2; }

  /* 3, 4: 고개 끄덕 */
  .s-ok .head-g { animation: nod 0.45s ease-in-out 2; }

  /* 2: 어깨 축 처짐 + 고개 젓기 */
  .s-sad .body-g { transform: translateY(4px); }
  .s-sad .head-g { animation: shake 0.4s ease-in-out 2; }

  /* 1: 머리 감싸기 */
  .s-bad .arm-l { transform: rotate(165deg); }
  .s-bad .arm-r { transform: rotate(-165deg); }
  .s-bad .body-g { animation: shake 0.3s ease-in-out 3; }

  @keyframes jump   { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-18px); } }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes nod    { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(0) translateY(4px); } }
  @keyframes shake  { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }
  @keyframes nervous { from { transform: translateY(0); } to { transform: translateY(-2px); } }
  @keyframes drip   { from { transform: translateY(0); opacity: 1; } to { transform: translateY(10px); opacity: 0; } }

  /* 말풍선 */
  .bubble {
    position: absolute;
    bottom: calc(100% + 6px);
    width: max-content;
    max-width: 38vw;
    padding: 7px 11px;
    border-radius: 14px;
    background: var(--bubble-bg);
    color: var(--bubble-text);
    font-size: clamp(12px, 3.4vw, 15px);
    font-weight: 700;
    line-height: 1.3;
    box-shadow: 0 6px 16px -6px var(--shadow);
    opacity: 0;
    transform: translateY(6px) scale(0.9);
    transition: opacity 0.25s, transform 0.25s;
    pointer-events: none;
  }
  .bubble::after {
    content: "";
    position: absolute;
    top: 100%;
    border: 7px solid transparent;
    border-top-color: var(--bubble-bg);
  }
  .man .bubble { left: 0; }
  .man .bubble::after { left: 24px; }
  .woman .bubble { right: 0; }
  .woman .bubble::after { right: 24px; }
  .bubble.show {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .result {
    min-height: 1.6em;
    font-size: 1.25rem;
    font-weight: 600;
  }
  .result strong {
    font-size: 1.6em;
    color: var(--btn);
  }

  button {
    font: inherit;
    font-size: 1.15rem;
    font-weight: 700;
    padding: 14px 44px;
    border: none;
    border-radius: 999px;
    color: var(--btn-text);
    background: var(--btn);
    box-shadow: 0 8px 20px -6px var(--btn);
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  button:hover:not(:disabled) { background: var(--btn-hover); }
  button:active:not(:disabled) { transform: translateY(2px); }
  button:disabled { opacity: 0.6; cursor: default; }
  button:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }

  .history {
    font-size: 0.9rem;
    color: var(--muted);
    min-height: 1.2em;
    text-align: center;
  }

  @media (prefers-reduced-motion: reduce) {
    .die { transition-duration: 0.01s; }
    .body-g, .head-g, .tear { animation: none !important; }
  }
</style>
</head>
<body>
  <h1>🎲 주사위 굴리기</h1>

  <div class="stage">
    <!-- 남자 구경꾼 -->
    <div class="person man s-idle" id="man">
      <div class="bubble" id="manBubble"></div>
      <svg viewBox="0 0 120 200" aria-hidden="true">
        <g class="body-g">
          <path class="shirt" d="M22 200 V142 Q22 112 60 110 Q98 112 98 142 V200 Z"/>
          <g class="arm arm-l"><line class="sleeve" x1="30" y1="128" x2="22" y2="178"/><circle class="skin" cx="22" cy="184" r="7"/></g>
          <g class="arm arm-r"><line class="sleeve" x1="90" y1="128" x2="98" y2="178"/><circle class="skin" cx="98" cy="184" r="7"/></g>
          <rect class="skin" x="52" y="92" width="16" height="20"/>
          <g class="head-g">
            <circle class="ear" cx="31" cy="70" r="6"/>
            <circle class="ear" cx="89" cy="70" r="6"/>
            <circle class="skin" cx="60" cy="68" r="30"/>
            <path class="hair" d="M29 66 Q28 34 60 33 Q92 34 91 66 Q86 50 74 47 Q62 54 46 47 Q34 52 29 66 Z"/>
            <g class="brows"><path class="line" d="M43 62 L54 58"/><path class="line" d="M77 62 L66 58"/></g>
            <g class="e e-normal"><g class="pupils"><circle class="dark" cx="49" cy="70" r="4"/><circle class="dark" cx="71" cy="70" r="4"/></g></g>
            <g class="e e-happy"><path class="line" d="M43 72 Q49 64 55 72"/><path class="line" d="M65 72 Q71 64 77 72"/></g>
            <g class="e e-wow"><circle class="white" cx="49" cy="69" r="7"/><circle class="white" cx="71" cy="69" r="7"/><circle class="dark" cx="49" cy="69" r="3.5"/><circle class="dark" cx="71" cy="69" r="3.5"/></g>
            <g class="e e-sad"><circle class="dark" cx="49" cy="72" r="3"/><circle class="dark" cx="71" cy="72" r="3"/></g>
            <g class="e e-closed"><path class="line" d="M44 68 L54 72 L44 76"/><path class="line" d="M76 68 L66 72 L76 76"/></g>
            <ellipse class="cheek" cx="41" cy="81" rx="5" ry="3"/>
            <ellipse class="cheek" cx="79" cy="81" rx="5" ry="3"/>
            <path class="tear" d="M43 78 Q40 84 43 86 Q46 84 43 78 Z"/>
            <path class="m m-smile line" d="M52 84 Q60 90 68 84"/>
            <ellipse class="m m-o mouth-in" cx="60" cy="86" rx="4" ry="5"/>
            <path class="m m-open mouth-in" d="M47 81 Q60 100 73 81 Z"/>
            <path class="m m-sad line" d="M52 89 Q60 82 68 89"/>
            <path class="m m-wail mouth-in" d="M50 92 Q60 78 70 92 Z"/>
          </g>
        </g>
      </svg>
    </div>

    <div class="scene" id="scene">
      <div class="tilt">
        <div class="die" id="die">
          <div class="face face-1"><span class="pip c"></span></div>
          <div class="face face-2"><span class="pip tl"></span><span class="pip br"></span></div>
          <div class="face face-3"><span class="pip tl"></span><span class="pip c"></span><span class="pip br"></span></div>
          <div class="face face-4"><span class="pip tl"></span><span class="pip tr"></span><span class="pip bl"></span><span class="pip br"></span></div>
          <div class="face face-5"><span class="pip tl"></span><span class="pip tr"></span><span class="pip c"></span><span class="pip bl"></span><span class="pip br"></span></div>
          <div class="face face-6"><span class="pip tl"></span><span class="pip tr"></span><span class="pip ml"></span><span class="pip mr"></span><span class="pip bl"></span><span class="pip br"></span></div>
        </div>
      </div>
    </div>

    <!-- 여자 구경꾼 -->
    <div class="person woman s-idle" id="woman">
      <div class="bubble" id="womanBubble"></div>
      <svg viewBox="0 0 120 200" aria-hidden="true">
        <g class="body-g">
          <g class="head-g">
            <path class="hair" d="M25 72 Q22 30 60 30 Q98 30 95 72 L99 124 Q80 116 60 116 Q40 116 21 124 Z"/>
          </g>
          <path class="shirt" d="M22 200 V142 Q22 112 60 110 Q98 112 98 142 V200 Z"/>
          <g class="arm arm-l"><line class="sleeve" x1="30" y1="128" x2="22" y2="178"/><circle class="skin" cx="22" cy="184" r="7"/></g>
          <g class="arm arm-r"><line class="sleeve" x1="90" y1="128" x2="98" y2="178"/><circle class="skin" cx="98" cy="184" r="7"/></g>
          <rect class="skin" x="52" y="92" width="16" height="20"/>
          <g class="head-g">
            <circle class="skin" cx="60" cy="68" r="30"/>
            <path class="hair" d="M29 68 Q28 32 60 32 Q92 32 91 68 Q84 48 64 46 Q50 52 29 68 Z"/>
            <circle class="pin" cx="82" cy="46" r="5"/>
            <g class="brows"><path class="line" d="M43 62 L54 58"/><path class="line" d="M77 62 L66 58"/></g>
            <g class="e e-normal"><g class="pupils"><circle class="dark" cx="49" cy="70" r="4"/><circle class="dark" cx="71" cy="70" r="4"/><path class="line" d="M44 65 L42 63"/><path class="line" d="M76 65 L78 63"/></g></g>
            <g class="e e-happy"><path class="line" d="M43 72 Q49 64 55 72"/><path class="line" d="M65 72 Q71 64 77 72"/></g>
            <g class="e e-wow"><circle class="white" cx="49" cy="69" r="7"/><circle class="white" cx="71" cy="69" r="7"/><circle class="dark" cx="49" cy="69" r="3.5"/><circle class="dark" cx="71" cy="69" r="3.5"/></g>
            <g class="e e-sad"><circle class="dark" cx="49" cy="72" r="3"/><circle class="dark" cx="71" cy="72" r="3"/></g>
            <g class="e e-closed"><path class="line" d="M44 68 L54 72 L44 76"/><path class="line" d="M76 68 L66 72 L76 76"/></g>
            <ellipse class="cheek" cx="41" cy="81" rx="5" ry="3"/>
            <ellipse class="cheek" cx="79" cy="81" rx="5" ry="3"/>
            <path class="tear" d="M77 78 Q74 84 77 86 Q80 84 77 78 Z"/>
            <path class="m m-smile line" d="M52 84 Q60 90 68 84"/>
            <ellipse class="m m-o mouth-in" cx="60" cy="86" rx="4" ry="5"/>
            <path class="m m-open mouth-in" d="M47 81 Q60 100 73 81 Z"/>
            <path class="m m-sad line" d="M52 89 Q60 82 68 89"/>
            <path class="m m-wail mouth-in" d="M50 92 Q60 78 70 92 Z"/>
          </g>
        </g>
      </svg>
    </div>
  </div>

  <div class="controls">
    <div class="result" id="result" aria-live="polite">버튼을 눌러 주사위를 굴려 보세요</div>
    <button type="button" id="rollBtn">굴리기</button>
    <div class="history" id="history"></div>
  </div>

<script>
  (function () {
    var die = document.getElementById('die');
    var scene = document.getElementById('scene');
    var btn = document.getElementById('rollBtn');
    var resultEl = document.getElementById('result');
    var historyEl = document.getElementById('history');

    var people = [
      { el: document.getElementById('man'),   bubble: document.getElementById('manBubble') },
      { el: document.getElementById('woman'), bubble: document.getElementById('womanBubble') }
    ];

    // 굴리는 동안 대사 [남자, 여자]
    var WATCH_LINES = [
      ['제발 6!', '두근두근…'],
      ['간다 간다!', '높은 숫자 나와라!'],
      ['이번엔 꼭!', '떨린다…']
    ];

    // 결과별 반응 [남자, 여자] - s: 표정 상태, t: 말풍선
    var REACTIONS = {
      6: [{ s: 'joy',   t: '대박!! 6이다!' },     { s: 'joy',   t: '꺄~ 최고야!' }],
      5: [{ s: 'happy', t: '좋았어!' },           { s: 'happy', t: '나이스~' }],
      4: [{ s: 'ok',    t: '음, 나쁘지 않네' },   { s: 'happy', t: '오, 괜찮은데?' }],
      3: [{ s: 'ok',    t: '딱 중간이네' },       { s: 'ok',    t: '무난무난~' }],
      2: [{ s: 'sad',   t: '에이… 아깝다' },      { s: 'sad',   t: '아쉽다…' }],
      1: [{ s: 'bad',   t: '으악! 1이라니!' },    { s: 'ok',    t: '괜찮아, 한 번 더!' }]
    };

    var STATES = ['s-idle', 's-watch', 's-ok', 's-happy', 's-joy', 's-sad', 's-bad'];

    function setPerson(p, state, text) {
      STATES.forEach(function (c) { p.el.classList.remove(c); });
      void p.el.offsetWidth; // 같은 상태가 연속돼도 애니메이션 재시작
      p.el.classList.add('s-' + state);
      if (text) {
        p.bubble.textContent = text;
        p.bubble.classList.add('show');
      } else {
        p.bubble.classList.remove('show');
      }
    }

    // 각 숫자가 정면에 오도록 하는 회전값 (deg)
    var FACE_ROTATION = {
      1: { x: 0,   y: 0 },
      2: { x: -90, y: 0 },
      3: { x: 0,   y: -90 },
      4: { x: 0,   y: 90 },
      5: { x: 90,  y: 0 },
      6: { x: 0,   y: 180 }
    };

    var turnsX = 0;
    var turnsY = 0;
    var history = [];
    var rolling = false;

    // 1~6 균등 난수 (가능하면 crypto 사용)
    function randomFace() {
      if (window.crypto && window.crypto.getRandomValues) {
        var buf = new Uint32Array(1);
        var limit = Math.floor(0x100000000 / 6) * 6; // 모듈로 편향 제거
        do { window.crypto.getRandomValues(buf); } while (buf[0] >= limit);
        return (buf[0] % 6) + 1;
      }
      return Math.floor(Math.random() * 6) + 1;
    }

    function randInt(min, max) {
      return min + Math.floor(Math.random() * (max - min + 1));
    }

    function roll() {
      if (rolling) return;
      rolling = true;
      btn.disabled = true;
      scene.classList.add('rolling');
      resultEl.textContent = '굴리는 중...';

      var lines = WATCH_LINES[randInt(0, WATCH_LINES.length - 1)];
      people.forEach(function (p, i) { setPerson(p, 'watch', lines[i]); });

      var value = randomFace();
      var target = FACE_ROTATION[value];

      // 매번 2~4바퀴 이상 추가로 돌아가도록 누적
      turnsX += randInt(2, 4);
      turnsY += randInt(2, 4);

      die.style.transform =
        'rotateX(' + (turnsX * 360 + target.x) + 'deg) ' +
        'rotateY(' + (turnsY * 360 + target.y) + 'deg)';

      var done = false;
      function finish() {
        if (done) return;
        done = true;
        die.removeEventListener('transitionend', finish);
        scene.classList.remove('rolling');
        resultEl.innerHTML = '결과: <strong>' + value + '</strong>';
        REACTIONS[value].forEach(function (r, i) { setPerson(people[i], r.s, r.t); });
        history.unshift(value);
        if (history.length > 10) history.pop();
        historyEl.textContent = '최근 기록: ' + history.join(' · ');
        rolling = false;
        btn.disabled = false;
        btn.focus();
      }
      die.addEventListener('transitionend', finish);
      setTimeout(finish, 1600); // transitionend 미발생 대비
    }

    btn.addEventListener('click', roll);
    document.addEventListener('keydown', function (e) {
      if ((e.code === 'Space' || e.code === 'Enter') && document.activeElement !== btn) {
        e.preventDefault();
        roll();
      }
    });
  })();
</script>
</body>
</html>
