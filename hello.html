<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>연습 페이지</title>
  <style>
    body { font-family: sans-serif; background: #f5f5f5; color: #222; margin: 0; padding: 40px 16px; text-align: center; }
    .card { max-width: 420px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 32px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    button { margin-top: 16px; padding: 10px 20px; font-size: 16px; border: none; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h1>안녕하세요 👋</h1>
    <p>브랜치 → PR → main 병합 연습용 페이지입니다.</p>
    <p>버튼 클릭 횟수: <strong id="count">0</strong></p>
    <button onclick="document.getElementById('count').textContent++">눌러보기</button>
  </div>
</body>
</html>
